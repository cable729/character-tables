group: UT_4(\mathbb{F}_q)

n: 4

columns:
  - {}
  - arcs:
      below:
        a: [1, 2]
        c: [3, 4]
      above:
        b: [2, 3]
    restriction: \neg(a=c=0)
  - arcs:
      below:
        a: [2, 3]
      above:
        b: [3, 4]
  - arcs:
      below:
        a: [1, 2]
      above:
        b: [2, 3]
  - arcs:
      below:
        a: [1, 3]
        b: [2, 4]
    restriction: \neg(a=b=0)
  - arcs:
      above:
        a: [1, 4]
  - arcs:
      below:
        a: [2, 3]
      above:
        b: [1, 4]
  - arcs:
      below:
        c: [2, 3]
      above:
        a: [1, 2]
        b: [3, 4]

rows:
  - {}
  - arcs:
      below:
        \alpha: [1, 2]
        \beta: [2, 3]
        \gamma: [3, 4]
    restriction: \neg(\alpha=\beta=\gamma=0)
  - arcs:
      above:
        \alpha: [1, 4]
      below:
        \beta: [3, 4]
  - arcs:
      below:
        \alpha: [1, 2]
      above:
        \beta: [2, 3]
  - arcs:
      above:
        \alpha: [1, 4]
      below:
        \beta: [2, 3]
  - arcs:
      above:
        \alpha: [1, 2]
        \beta: [2, 3]
      below:
        \gamma: [1, 3]

matrix:
  - [1, 1, 1, 1, 1, 1, 1, 1]
  - [1, \theta(\alpha a)\theta(\beta b)\theta(\gamma c), \theta(\gamma b), \theta(\alpha a), 1, 1, \theta(\beta b), \theta(\alpha a)\theta(\beta b)]
  - [q, 0, q\theta(\alpha a)\theta(\beta b), 0, q\theta(\alpha a), q, 0, 0]
  - [q, 0, 0, q\theta(\alpha a)\theta(\beta b), q\theta(\beta b), q, 0, 0]
  - [q^2, 0, 0, 0, 0, q^2\theta(\alpha a), q\theta(\alpha a)\theta(\beta b), 0]
  - [q, 0, 0, 0, q\theta(\alpha a)\theta(\beta b), q, 0, q\delta\theta(\alpha c)\theta(\gamma a)]
