group: UT_4(\mathbb{F}_q)
groupSpec:
  kind: ut_n
  n: 4
groupOrder: q^{6}

n: 4

# Canonical column order (Andre-style condensed classes)
columns:
  - classSize: 1
  - classSize: q^{3}
    expansionCount: (q^2-1)(q-1)
    arcs:
      below:
        a: [1, 2]
        c: [3, 4]
      above:
        b: [2, 3]
    restriction: \neg(a=c=0)
  - classSize: q^{2}
    arcs:
      below:
        a: [1, 3]
      above:
        b: [3, 4]
  - classSize: q^{2}
    arcs:
      below:
        b: [2, 4]
      above:
        a: [1, 2]
  - classSize: q
    expansionCount: q^{2} - 1
    arcs:
      below:
        a: [1, 3]
        b: [2, 4]
    restriction: \neg(a=b=0)
  - classSize: 1
    arcs:
      above:
        a: [1, 4]
  - classSize: q^{2}
    arcs:
      below:
        a: [1, 4]
      above:
        b: [2, 3]
  - classSize: q^{2}
    arcs:
      below:
        c: [1, 3]
      above:
        a: [1, 2]
        b: [2, 4]

rows:
  - {}
  - arcs:
      below:
        \alpha: [1, 2]
        \beta: [2, 3]
        \gamma: [3, 4]
    expansionCount: q^{3} - 1
    restriction: \neg(\alpha=\beta=\gamma=0)
  - arcs:
      below:
        \beta: [3, 4]
      above:
        \alpha: [1, 3]
  - arcs:
      below:
        \alpha: [1, 2]
      above:
        \beta: [2, 4]
  - arcs:
      above:
        \alpha: [1, 4]
      below:
        \beta: [2, 3]
  - arcs:
      below:
        \gamma: [1, 2]
      above:
        \alpha: [1, 3]
        \beta: [2, 4]

matrix:
  - [1, 1, 1, 1, 1, 1, 1, 1]
  - [1, \theta(\alpha a)\theta(\beta b)\theta(\gamma c), \theta(\gamma b), \theta(\alpha a), 1, 1, \theta(\beta b), \theta(\alpha a)\theta(\gamma b)]
  - [q, 0, q\theta(\alpha a)\theta(\beta b), 0, q\theta(\alpha a), q, 0, 0]
  - [q, 0, 0, q\theta(\alpha a)\theta(\beta b), q\theta(\beta b), q, 0, 0]
  - [q^2, 0, 0, 0, 0, q^2\theta(\alpha a), q\theta(\alpha a)\theta(\beta b), 0]
  - [q, 0, 0, 0, q\theta(\alpha a)\theta(\beta b), q, 0, \andre]
