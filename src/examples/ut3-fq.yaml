group: UT_3(\mathbb{F}_q)
groupOrder: q^{3}

n: 3

columns:
  - classSize: 1
  - classSize: q
    arcs:
      above:
        a: [1, 2]
  - classSize: q
    arcs:
      above:
        b: [2, 3]
  - classSize: q
    arcs:
      above:
        a: [1, 2]
        b: [2, 3]
  - classSize: 1
    arcs:
      above:
        c: [1, 3]

rows:
  - {}
  - arcs:
      above:
        \alpha: [1, 2]
  - arcs:
      above:
        \beta: [2, 3]
  - arcs:
      above:
        \alpha: [1, 2]
        \beta: [2, 3]
  - arcs:
      above:
        \gamma: [1, 3]

matrix:
  - [1, 1, 1, 1, 1]
  - [1, \theta(\alpha a), 1, \theta(\alpha a), 1]
  - [1, 1, \theta(\beta b), \theta(\beta b), 1]
  - [1, \theta(\alpha a), \theta(\beta b), \theta(\alpha a)\theta(\beta b), 1]
  - [q, 0, 0, 0, q\theta(\gamma c)]
